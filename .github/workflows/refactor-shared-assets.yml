name: Refactor shared frontend assets

on:
  push:
    paths:
      - '.github/workflows/refactor-shared-assets.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract shared CSS and wire shared JS
        shell: python
        run: |
          from pathlib import Path
          import re

          root_path = Path('index.html')
          sqlite_path = Path('sqlite/index.php')
          root = root_path.read_text(encoding='utf-8')
          sqlite = sqlite_path.read_text(encoding='utf-8')

          style_re = re.compile(r'<style>\s*(.*?)\s*</style>', re.S)
          script_re = re.compile(r'<script>\s*(.*?)\s*</script>', re.S)

          root_style = style_re.search(root)
          sqlite_style = style_re.search(sqlite)
          if not root_style or not sqlite_style:
              raise SystemExit('inline style block not found')
          if root_style.group(1).strip() != sqlite_style.group(1).strip():
              raise SystemExit('static and SQLite CSS are not identical; aborting shared extraction')

          css = root_style.group(1).strip() + '\n'
          css_path = Path('assets/css/contract.css')
          css_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.write_text(css, encoding='utf-8')

          root = style_re.sub('<link rel="stylesheet" href="assets/css/contract.css">', root, count=1)
          root = root.replace(
              '<body>',
              '<body data-contract-mode="static" data-storage-key="website_contract_builder_v1" data-schema-version="1">',
              1
          )
          if not script_re.search(root):
              raise SystemExit('static inline script block not found')
          root = script_re.sub('<script src="assets/js/contract.js"></script>', root, count=1)

          php_header = "<?php\n$assetBase = is_dir(__DIR__ . '/assets') ? 'assets' : '../assets';\n?>\n"
          if not sqlite.startswith('<?php'):
              sqlite = php_header + sqlite

          sqlite = style_re.sub(
              '<link rel="stylesheet" href="<?= htmlspecialchars($assetBase, ENT_QUOTES, \'UTF-8\') ?>/css/contract.css">',
              sqlite,
              count=1
          )
          sqlite = sqlite.replace(
              '<body>',
              '<body data-contract-mode="sqlite" data-storage-key="website_contract_builder_sqlite_v1" data-schema-version="2" data-api-load="api/load.php" data-api-save="api/save.php">',
              1
          )
          if not script_re.search(sqlite):
              raise SystemExit('SQLite inline script block not found')
          sqlite = script_re.sub(
              '<script src="<?= htmlspecialchars($assetBase, ENT_QUOTES, \'UTF-8\') ?>/js/contract.js"></script>',
              sqlite,
              count=1
          )

          root_path.write_text(root, encoding='utf-8')
          sqlite_path.write_text(sqlite, encoding='utf-8')

      - name: Validate shared assets
        run: |
          node --check assets/js/contract.js
          php -l sqlite/index.php
          test -s assets/css/contract.css
          grep -q 'assets/js/contract.js' index.html
          grep -q 'contract-mode="sqlite"' sqlite/index.php

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sqlite/index.php assets/css/contract.css assets/js/contract.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: 静态版与 SQLite 版共用前端资源"
          git push
