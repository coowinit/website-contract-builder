name: Make attachment confirmations manual

on:
  push:
    paths:
      - '.github/workflows/manual-confirm-fields-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manual confirmation fields
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('sqlite/index.php')]

          for path in files:
              text = path.read_text(encoding='utf-8')

              replacements = [
                  ("      ['meta.signDate','attachment.partyADate'],\n", ''),
                  ("      ['meta.signDate','attachment.partyBDate'],\n", ''),
                  ("      ['partyA.name','attachment.partyAConfirm'],\n", ''),
                  ("      ['partyB.name','attachment.partyBConfirm']\n", '')
              ]

              for old, new in replacements:
                  text = text.replace(old, new)

              # Clean possible dangling comma before array close.
              text = text.replace("      ['partyA.contact','sign.partyARep'],\n    ];", "      ['partyA.contact','sign.partyARep']\n    ];")

              path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sqlite/index.php
          git diff --cached --quiet && exit 0
          git commit -m "fix: 确认人与确认日期改为手动填写"
          git push
