name: Final font and label tweak
on:
  push:
    paths:
      - '.github/workflows/final-font-label-tweak.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final typography and label changes
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/css/contract.css')
          css = css_path.read_text(encoding='utf-8')

          css = css.replace('font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;', 'font-family:"Microsoft YaHei",Arial,sans-serif;')
          css = css.replace('font-family:"SimSun","Songti SC","STSong",serif;', 'font-family:"Microsoft YaHei",Arial,sans-serif;')
          css = css.replace('font-size:18px;\n    font-weight:700;\n  }\n  .clause ol{', 'font-size:20px;\n    font-weight:700;\n  }\n  .clause ol{', 1)
          css = css.replace('.clause h2{font-size:11.5pt;margin-bottom:3px;padding-bottom:3px}', '.clause h2{font-size:20px;margin-bottom:3px;padding-bottom:3px}')
          css_path.write_text(css, encoding='utf-8')

          old_css = 'contract.css?v=1.2.0-20260929-3'
          new_css = 'contract.css?v=1.2.0-20260929-4'

          for file in [Path('index.html'), Path('sqlite/index.php')]:
              text = file.read_text(encoding='utf-8')
              text = text.replace('甲方确认：</span>', '甲方：</span>')
              text = text.replace('乙方确认：</span>', '乙方：</span>')
              text = text.replace(old_css, new_css)
              file.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          grep -q 'font-size:20px' assets/css/contract.css
          grep -q 'Microsoft YaHei' assets/css/contract.css
          ! grep -q 'SimSun' assets/css/contract.css
          grep -q '甲方：</span>' index.html
          grep -q '乙方：</span>' index.html
          grep -q '甲方：</span>' sqlite/index.php
          grep -q '乙方：</span>' sqlite/index.php
          grep -q 'contract.css?v=1.2.0-20260929-4' index.html
          grep -q 'contract.css?v=1.2.0-20260929-4' sqlite/index.php
          php -l sqlite/index.php
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/contract.css index.html sqlite/index.php
          git diff --cached --quiet && exit 0
          git commit -m "style: 统一微软雅黑并优化合同标题与确认标签"
          git push
