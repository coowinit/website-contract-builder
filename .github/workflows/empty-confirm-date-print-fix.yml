name: Fix empty confirmation dates in print

on:
  push:
    paths:
      - '.github/workflows/empty-confirm-date-print-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch empty confirmation date printing
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('sqlite/index.php')]

          helper = r'''  // 空白的“确认日期”在 Chrome 打印时会显示“年/月/日”。
          // 打印前临时改成普通文本框，打印结束后恢复 date 类型。
          const confirmDateKeys=[
            'attachment.partyADate',
            'attachment.partyBDate'
          ];

          function prepareEmptyConfirmDatesForPrint(){
            confirmDateKeys.forEach(key=>{
              const el=document.querySelector(`[data-key="${key}"]`);
              if(!el || el.value) return;
              el.dataset.printOriginalType=el.type;
              el.type='text';
              el.value='';
              el.placeholder='';
            });
          }

          function restoreConfirmDatesAfterPrint(){
            confirmDateKeys.forEach(key=>{
              const el=document.querySelector(`[data-key="${key}"]`);
              if(!el || !el.dataset.printOriginalType) return;
              el.type=el.dataset.printOriginalType;
              delete el.dataset.printOriginalType;
            });
          }

          window.addEventListener('afterprint', restoreConfirmDatesAfterPrint);

'''

          for path in files:
              text = path.read_text(encoding='utf-8')

              if 'function prepareEmptyConfirmDatesForPrint()' not in text:
                  anchor = '  function syncFormStateForPrint(){\n'
                  if anchor not in text:
                      raise SystemExit(f'{path}: syncFormStateForPrint anchor not found')
                  text = text.replace(anchor, helper + anchor, 1)

              # Add prepare call immediately before entering print preview.
              marker = "    const wasPreview=app.classList.contains('preview-mode');\n"
              replacement = "    prepareEmptyConfirmDatesForPrint();\n\n" + marker
              if 'prepareEmptyConfirmDatesForPrint();\n\n    const wasPreview' not in text:
                  if marker not in text:
                      raise SystemExit(f'{path}: print handler marker not found')
                  text = text.replace(marker, replacement, 1)

              path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sqlite/index.php
          git diff --cached --quiet && exit 0
          git commit -m "fix: 空白确认日期打印为纯空白"
          git push
