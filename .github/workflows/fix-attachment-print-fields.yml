name: Fix attachment print fields

on:
  push:
    paths:
      - '.github/workflows/fix-attachment-print-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch shared JS and CSS
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('assets/js/contract.js')
          css_path = Path('assets/css/contract.css')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          old_js = '''  function syncSpecialNotesPrint(){
    const source=document.querySelector('textarea[data-key="special.notes"]');
    const target=document.getElementById('specialNotesPrint');
    if(source && target) target.textContent=source.value || '';
  }

  const confirmDateKeys=['attachment.partyADate','attachment.partyBDate'];'''

          new_js = '''  function syncSpecialNotesPrint(){
    const source=document.querySelector('textarea[data-key="special.notes"]');
    const target=document.getElementById('specialNotesPrint');
    if(source && target) target.textContent=source.value || '';
  }

  // 单行 input 和 textarea 在浏览器打印时可能截断长内容。
  // 对附件中需要完整展示的字段生成打印专用文本镜像，编辑界面仍保留原输入控件。
  const printMirrorKeys=['project.languages','project.references'];

  function syncFieldPrintMirrors(){
    printMirrorKeys.forEach(key=>{
      const source=document.querySelector(`[data-key="${key}"]`);
      if(!source || !source.parentElement) return;

      let mirror=source.parentElement.querySelector(`.field-print-mirror[data-print-key="${key}"]`);
      if(!mirror){
        mirror=document.createElement('div');
        mirror.className='field-print-mirror';
        mirror.dataset.printKey=key;
        source.insertAdjacentElement('afterend',mirror);
      }
      mirror.textContent=source.value || '';
    });
  }

  const confirmDateKeys=['attachment.partyADate','attachment.partyBDate'];'''

          if old_js not in js:
              raise SystemExit('JS anchor 1 not found')
          js = js.replace(old_js, new_js, 1)

          old_js2 = '''    syncSpecialNotesPrint();
  }

  function autoGrow(el){'''
          new_js2 = '''    syncSpecialNotesPrint();
    syncFieldPrintMirrors();
  }

  function autoGrow(el){'''
          if old_js2 not in js:
              raise SystemExit('JS anchor 2 not found')
          js = js.replace(old_js2, new_js2, 1)

          old_js3 = '''      if(e.target.matches('textarea[data-key="special.notes"]')) syncSpecialNotesPrint();
      scheduleSave();'''
          new_js3 = '''      if(e.target.matches('textarea[data-key="special.notes"]')) syncSpecialNotesPrint();
      if(printMirrorKeys.includes(e.target.dataset.key)) syncFieldPrintMirrors();
      scheduleSave();'''
          if old_js3 not in js:
              raise SystemExit('JS anchor 3 not found')
          js = js.replace(old_js3, new_js3, 1)

          old_js4 = '''  syncSpecialNotesPrint();

  if(IS_SQLITE){'''
          new_js4 = '''  syncSpecialNotesPrint();
  syncFieldPrintMirrors();

  if(IS_SQLITE){'''
          if old_js4 not in js:
              raise SystemExit('JS anchor 4 not found')
          js = js.replace(old_js4, new_js4, 1)

          css_anchor = '''  .special-notes-print{
    display:none;
    white-space:pre-wrap;
    word-break:break-word;
  }'''
          css_replacement = '''  .special-notes-print{
    display:none;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .field-print-mirror{
    display:none;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
  }'''
          if css_anchor not in css:
              raise SystemExit('CSS anchor 1 not found')
          css = css.replace(css_anchor, css_replacement, 1)

          css_anchor2 = '''    .special-notes-print{
      display:block!important;
      white-space:pre-wrap!important;
      word-break:break-word!important;
      line-height:1.48!important;
      margin:0!important;
      padding:0!important;
      color:#000!important;
    }'''
          css_replacement2 = '''    .special-notes-print{
      display:block!important;
      white-space:pre-wrap!important;
      word-break:break-word!important;
      line-height:1.48!important;
      margin:0!important;
      padding:0!important;
      color:#000!important;
    }
    .project-info [data-key="project.languages"],
    .project-info [data-key="project.references"]{
      display:none!important;
    }
    .project-info .field-print-mirror{
      display:block!important;
      width:100%!important;
      margin:0!important;
      padding:0!important;
      color:#000!important;
      white-space:pre-wrap!important;
      overflow-wrap:anywhere!important;
      word-break:break-word!important;
      line-height:1.42!important;
    }
    .project-info td:has([data-key="project.workDays2"]){
      white-space:nowrap;
    }
    .project-info [data-key="project.workDays2"]{
      width:52px!important;
      min-width:52px!important;
      max-width:52px!important;
      text-align:center!important;
    }
    .project-info [data-key="project.revisionRounds2"],
    .project-info [data-key="project.warrantyDays2"]{
      width:44px!important;
      min-width:44px!important;
      max-width:44px!important;
      text-align:center!important;
    }'''
          if css_anchor2 not in css:
              raise SystemExit('CSS anchor 2 not found')
          css = css.replace(css_anchor2, css_replacement2, 1)

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

      - name: Validate
        run: |
          node --check assets/js/contract.js
          grep -q 'field-print-mirror' assets/css/contract.css
          grep -q 'project.languages' assets/js/contract.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/contract.js assets/css/contract.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: 完整打印附件长文本并优化周期字段"
          git push
