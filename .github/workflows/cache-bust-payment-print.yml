name: Confirmation two-column print
on:
  push:
    paths:
      - '.github/workflows/cache-bust-payment-print.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update print layout and cache version
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/css/contract.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* v1.2.0 attachment confirmation two-column print */'
          if marker not in css:
              css += '''\n\n/* v1.2.0 attachment confirmation two-column print */\n@media print {\n  .attachment-sign {\n    display: grid !important;\n    grid-template-columns: 1fr 1fr !important;\n    gap: 24px !important;\n    align-items: start !important;\n    margin-top: 12px !important;\n    break-inside: avoid !important;\n  }\n\n  .attachment-sign > div {\n    min-width: 0 !important;\n  }\n\n  .attachment-sign .sign-line {\n    grid-template-columns: 62px 1fr !important;\n    gap: 6px !important;\n    margin: 6px 0 !important;\n  }\n}\n'''
              css_path.write_text(css, encoding='utf-8')

          old = 'contract.css?v=1.2.0-20260929-2'
          new = 'contract.css?v=1.2.0-20260929-3'
          for file in [Path('index.html'), Path('sqlite/index.php')]:
              text = file.read_text(encoding='utf-8').replace(old, new)
              file.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          grep -q 'attachment confirmation two-column print' assets/css/contract.css
          grep -q 'contract.css?v=1.2.0-20260929-3' index.html
          grep -q 'contract.css?v=1.2.0-20260929-3' sqlite/index.php
          php -l sqlite/index.php

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/contract.css index.html sqlite/index.php
          git diff --cached --quiet && exit 0
          git commit -m "style: 附件确认区打印恢复双列布局"
          git push
