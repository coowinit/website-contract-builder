name: Fix attachment print fields 2
on:
  push:
    paths:
      - '.github/workflows/fix-attachment-print-fields-2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shared assets
        run: |
          python - <<'PY'
          from pathlib import Path
          js_path=Path('assets/js/contract.js')
          css_path=Path('assets/css/contract.css')
          js=js_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          a='''  function syncSpecialNotesPrint(){\n    const source=document.querySelector('textarea[data-key="special.notes"]');\n    const target=document.getElementById('specialNotesPrint');\n    if(source && target) target.textContent=source.value || '';\n  }\n\n  const confirmDateKeys=['attachment.partyADate','attachment.partyBDate'];'''
          b='''  function syncSpecialNotesPrint(){\n    const source=document.querySelector('textarea[data-key="special.notes"]');\n    const target=document.getElementById('specialNotesPrint');\n    if(source && target) target.textContent=source.value || '';\n  }\n\n  // 打印时用普通文本完整展示容易被 input / textarea 截断的长字段。\n  const printMirrorKeys=['project.languages','project.references'];\n\n  function syncFieldPrintMirrors(){\n    printMirrorKeys.forEach(key=>{\n      const source=document.querySelector(`[data-key="${key}"]`);\n      if(!source || !source.parentElement) return;\n      let mirror=source.parentElement.querySelector(`.field-print-mirror[data-print-key="${key}"]`);\n      if(!mirror){\n        mirror=document.createElement('div');\n        mirror.className='field-print-mirror';\n        mirror.dataset.printKey=key;\n        source.insertAdjacentElement('afterend',mirror);\n      }\n      mirror.textContent=source.value || '';\n    });\n  }\n\n  const confirmDateKeys=['attachment.partyADate','attachment.partyBDate'];'''
          if a not in js: raise SystemExit('anchor a missing')
          js=js.replace(a,b,1)

          a='''    syncSpecialNotesPrint();\n  }\n\n  function autoGrow(el){'''
          b='''    syncSpecialNotesPrint();\n    syncFieldPrintMirrors();\n  }\n\n  function autoGrow(el){'''
          if a not in js: raise SystemExit('anchor b missing')
          js=js.replace(a,b,1)

          a='''    if(e.target.matches('textarea[data-key="special.notes"]')) syncSpecialNotesPrint();\n    scheduleSave();'''
          b='''    if(e.target.matches('textarea[data-key="special.notes"]')) syncSpecialNotesPrint();\n    if(printMirrorKeys.includes(e.target.dataset.key)) syncFieldPrintMirrors();\n    scheduleSave();'''
          if a not in js: raise SystemExit('anchor c missing')
          js=js.replace(a,b,1)

          a='''  syncSpecialNotesPrint();\n\n  if(IS_SQLITE){'''
          b='''  syncSpecialNotesPrint();\n  syncFieldPrintMirrors();\n\n  if(IS_SQLITE){'''
          if a not in js: raise SystemExit('anchor d missing')
          js=js.replace(a,b,1)

          a='''  .special-notes-print{\n    display:none;\n    white-space:pre-wrap;\n    word-break:break-word;\n  }'''
          b='''  .special-notes-print{\n    display:none;\n    white-space:pre-wrap;\n    word-break:break-word;\n  }\n  .field-print-mirror{\n    display:none;\n    white-space:pre-wrap;\n    overflow-wrap:anywhere;\n    word-break:break-word;\n  }'''
          if a not in css: raise SystemExit('css a missing')
          css=css.replace(a,b,1)

          a='''    .special-notes-print{\n      display:block!important;\n      white-space:pre-wrap!important;\n      word-break:break-word!important;\n      line-height:1.48!important;\n      margin:0!important;\n      padding:0!important;\n      color:#000!important;\n    }'''
          b='''    .special-notes-print{\n      display:block!important;\n      white-space:pre-wrap!important;\n      word-break:break-word!important;\n      line-height:1.48!important;\n      margin:0!important;\n      padding:0!important;\n      color:#000!important;\n    }\n    .project-info [data-key="project.languages"],\n    .project-info [data-key="project.references"]{\n      display:none!important;\n    }\n    .project-info .field-print-mirror{\n      display:block!important;\n      width:100%!important;\n      margin:0!important;\n      padding:0!important;\n      color:#000!important;\n      white-space:pre-wrap!important;\n      overflow-wrap:anywhere!important;\n      word-break:break-word!important;\n      line-height:1.42!important;\n    }\n    .project-info td:has([data-key="project.workDays2"]){\n      white-space:nowrap;\n    }\n    .project-info [data-key="project.workDays2"]{\n      width:52px!important;\n      min-width:52px!important;\n      max-width:52px!important;\n      text-align:center!important;\n    }\n    .project-info [data-key="project.revisionRounds2"],\n    .project-info [data-key="project.warrantyDays2"]{\n      width:44px!important;\n      min-width:44px!important;\n      max-width:44px!important;\n      text-align:center!important;\n    }'''
          if a not in css: raise SystemExit('css b missing')
          css=css.replace(a,b,1)

          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check assets/js/contract.js
          grep -q 'field-print-mirror' assets/css/contract.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/contract.js assets/css/contract.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: 完整打印附件长文本并优化周期字段"
          git push
