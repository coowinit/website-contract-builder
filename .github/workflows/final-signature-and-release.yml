name: Final signature and release prep
on:
  push:
    paths:
      - '.github/workflows/final-signature-and-release.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final signature and version updates
        shell: python
        run: |
          from pathlib import Path
          import re

          for file in [Path('index.html'), Path('sqlite/index.php')]:
              text = file.read_text(encoding='utf-8')
              text = text.replace('签署人 / 授权代表：</span>', '签署人：</span>')
              text = text.replace('contract.css?v=1.2.0-20260929-4', 'contract.css?v=1.2.0-20260929-5')
              file.write_text(text, encoding='utf-8')

          css_path = Path('assets/css/contract.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* v1.2.0 final main signature print layout */'
          if marker not in css:
              css += '''\n\n/* v1.2.0 final main signature print layout */\n@media print {\n  .signature {\n    display: grid !important;\n    grid-template-columns: 1fr 1fr !important;\n    gap: 32px !important;\n    align-items: start !important;\n    break-inside: avoid !important;\n  }\n\n  .signature .sign-line {\n    grid-template-columns: 72px 1fr !important;\n    gap: 8px !important;\n  }\n}\n'''
          css_path.write_text(css, encoding='utf-8')

          Path('VERSION').write_text('1.2.0\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'(## 十二、当前版本\s*```text\s*)v?1\.1\.3(\s*```)', r'\g<1>v1.2.0\g<2>', readme, count=1)
          if '### v1.2.0' not in readme:
              readme += '''\n\n### v1.2.0\n\n完成共享前端结构重构与打印收尾：静态版和 SQLite / PHP 版共用 CSS / JS；完善 PHP 独立部署与迁移说明；统一微软雅黑；优化打印长文本、付款、附件确认及主合同签署区；主合同签署字段简化为“签署人”，打印保持甲乙双方左右双列。\n'''
          readme_path.write_text(readme, encoding='utf-8')

          sqlite_readme_path = Path('sqlite/README.md')
          sqlite_readme = sqlite_readme_path.read_text(encoding='utf-8')
          if '## v1.2.0' not in sqlite_readme:
              sqlite_readme += '''\n\n## v1.2.0\n\n- 与静态版共用公共 CSS / JS\n- PHP 独立部署需同时复制 `assets/`\n- 使用资源版本号降低缓存干扰\n- 主合同签署区打印保持左右双列，字段简化为“签署人”\n'''
          sqlite_readme_path.write_text(sqlite_readme, encoding='utf-8')

      - name: Validate
        run: |
          grep -q '签署人：</span>' index.html
          grep -q '签署人：</span>' sqlite/index.php
          grep -q 'final main signature print layout' assets/css/contract.css
          grep -q 'contract.css?v=1.2.0-20260929-5' index.html
          grep -q 'contract.css?v=1.2.0-20260929-5' sqlite/index.php
          grep -q '^1.2.0$' VERSION
          php -l sqlite/index.php
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sqlite/index.php assets/css/contract.css VERSION README.md sqlite/README.md
          git diff --cached --quiet && exit 0
          git commit -m "release: finalize v1.2.0 shared assets and print layout"
          git push
