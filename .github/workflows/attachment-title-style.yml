name: Attachment title style
on:
  push:
    paths:
      - '.github/workflows/attachment-title-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update title style and CSS cache version
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('assets/css/contract.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* v1.2.0 attachment title final style */'
          if marker not in css:
              css += '''\n\n/* v1.2.0 attachment title final style */\n.attachment-title {\n  font-size: 20px !important;\n  font-weight: 700 !important;\n}\n\n@media print {\n  .attachment-title {\n    font-size: 20px !important;\n    font-weight: 700 !important;\n  }\n}\n'''
          css_path.write_text(css, encoding='utf-8')

          old = 'contract.css?v=1.2.0-20260929'
          new = 'contract.css?v=1.2.0-20260929-2'
          for file in [Path('index.html'), Path('sqlite/index.php')]:
              text = file.read_text(encoding='utf-8').replace(old, new)
              file.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          grep -q 'attachment title final style' assets/css/contract.css
          grep -q 'contract.css?v=1.2.0-20260929-2' index.html
          grep -q 'contract.css?v=1.2.0-20260929-2' sqlite/index.php
          php -l sqlite/index.php

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/contract.css index.html sqlite/index.php
          git diff --cached --quiet && exit 0
          git commit -m "style: 调整附件标题字号并更新CSS缓存版本"
          git push
