name: Final print style tweaks

on:
  push:
    paths:
      - '.github/workflows/final-print-style-tweaks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final print style overrides
        shell: python
        run: |
          from pathlib import Path
          path = Path('assets/css/contract.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* v1.2.0 print refinements: attachment payment + confirmation spacing */'
          if marker not in css:
              css += '''\n\n/* v1.2.0 print refinements: attachment payment + confirmation spacing */\n@media print {\n  .project-info [data-key="payment.total2"] {\n    width: 72px !important;\n    min-width: 72px !important;\n    max-width: 72px !important;\n    margin: 0 2px !important;\n    text-align: left !important;\n  }\n\n  .project-info [data-key="payment.method"] {\n    width: 170px !important;\n    min-width: 170px !important;\n    max-width: 170px !important;\n    margin-left: 4px !important;\n  }\n\n  .attachment .note + p {\n    margin-top: 14px !important;\n    margin-bottom: 8px !important;\n  }\n\n  .attachment-sign {\n    margin-top: 10px !important;\n  }\n}\n'''
              path.write_text(css, encoding='utf-8')

      - name: Validate CSS markers
        run: |
          grep -q 'payment.total2' assets/css/contract.css
          grep -q '.attachment .note + p' assets/css/contract.css

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/contract.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: 优化附件付款与确认区域打印间距"
          git push
